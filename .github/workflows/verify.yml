name: Verify archived implementation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-core.txt
      # archive hashes, generated documents, tests of every stage, examples (the commands of the README)
      - run: python tools/run_cpu_checks.py
      # the anonymized archive still builds and contains no identifying string
      - run: python tools/make_submission_zip.py --out "$RUNNER_TEMP/salmon_ladder_supplementary.zip"
