name: Verify archived implementation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-core.txt
      - run: python tools/verify_snapshot.py
      - run: python -m pytest -q experiments/controls_456/src/test_controls.py
      - run: PYTHONPATH=experiments/legacy python -m pytest -q experiments/legacy/tests/test_r5.py
      - run: python examples/feature_stream.py
